<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国经济数据分析平台</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* 登录遮罩层 */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }

        .login-card input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .login-card input:focus {
            border-color: #667eea;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }

        /* 主体内容 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: none;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            padding: 8px 20px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .year-filter {
            background: white;
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .year-filter label {
            font-weight: bold;
        }

        .year-btn {
            padding: 8px 20px;
            background: #f0f2f5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .year-btn.active {
            background: #667eea;
            color: white;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .charts-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
        }

        .chart-card h3 {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .chart-box {
            width: 100%;
            height: 350px;
        }

        .table-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <h2>📊 经济数据平台</h2>
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <button onclick="handleLogin()">登 录</button>
            <div class="error-msg" id="loginError"></div>
        </div>
    </div>

    <!-- 主体内容 -->
    <div class="container" id="mainContent">
        <div class="header">
            <h1>📈 全国经济数据分析平台</h1>
            <div class="user-info">
                <span>👤 <span id="currentUser"></span></span>
                <button class="logout-btn" onclick="handleLogout()">退 出</button>
            </div>
        </div>

        <div class="year-filter">
            <label>📅 选择年份：</label>
            <button class="year-btn" data-year="2021">2021年</button>
            <button class="year-btn" data-year="2022">2022年</button>
            <button class="year-btn" data-year="2023">2023年</button>
            <button class="year-btn" data-year="2024">2024年</button>
        </div>

        <div class="stats-row">
            <div class="stat-card"><h3>GDP总量（亿元）</h3><div class="value" id="totalGdp">-</div></div>
            <div class="stat-card"><h3>人均GDP（万元）</h3><div class="value" id="avgGdpPerCapita">-</div></div>
            <div class="stat-card"><h3>平均人口（万人）</h3><div class="value" id="avgPopulation">-</div></div>
            <div class="stat-card"><h3>省份数量</h3><div class="value" id="provinceCount">-</div></div>
        </div>

        <div class="charts-row">
            <div class="chart-card"><h3>📊 各省GDP对比</h3><div id="barChart" class="chart-box"></div></div>
            <div class="chart-card"><h3>🥧 GDP占比分布</h3><div id="pieChart" class="chart-box"></div></div>
        </div>

        <div class="charts-row">
            <div class="chart-card"><h3>📈 GDP增长趋势</h3><div id="lineChart" class="chart-box"></div></div>
            <div class="chart-card"><h3>👥 人口与GDP关系</h3><div id="scatterChart" class="chart-box"></div></div>
        </div>

        <div class="table-card">
            <h3>📋 各省份详细数据</h3>
            <table id="dataTable">
                <thead><tr><th>省份</th><th>GDP(亿元)</th><th>人口(万人)</th><th>人均GDP(万元)</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // API 基础地址（Cloudflare Workers 部署后的域名）
        const API_BASE = window.location.origin;
        
        let currentYear = 2024;
        let currentToken = null;
        let charts = {};

        // 获取请求头
        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${currentToken}`
            };
        }

        // 登录
        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            if (!username || !password) {
                errorDiv.innerText = '请输入用户名和密码';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    currentToken = data.token;
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    document.getElementById('currentUser').innerText = data.username;
                    await loadData();
                } else {
                    errorDiv.innerText = data.error || '登录失败';
                }
            } catch (err) {
                errorDiv.innerText = '网络错误，请稍后重试';
            }
        }

        // 退出
        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            currentToken = null;
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
        }

        // 检查登录状态
        async function checkAuth() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            
            if (token && username) {
                currentToken = token;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('currentUser').innerText = username;
                await loadData();
            }
        }

        // 加载数据
        async function loadData() {
            showLoading();
            
            try {
                // 获取当前年份数据
                const res = await fetch(`${API_BASE}/api/data?year=${currentYear}`, {
                    headers: getHeaders()
                });
                const data = await res.json();

                if (data.success) {
                    renderAll(data.data);
                } else if (data.error === '未授权') {
                    handleLogout();
                } else {
                    console.error('数据加载失败', data.error);
                }
            } catch (err) {
                console.error('请求失败', err);
            }
        }

        // 加载所有年份数据（用于折线图）
        async function loadAllYearsData() {
            const years = [2021, 2022, 2023, 2024];
            const results = {};

            for (const year of years) {
                try {
                    const res = await fetch(`${API_BASE}/api/data?year=${year}`, {
                        headers: getHeaders()
                    });
                    const data = await res.json();
                    if (data.success) {
                        results[year] = data.data;
                    }
                } catch (err) {
                    console.error(`加载${year}年数据失败`, err);
                }
            }
            return results;
        }

        // 渲染所有内容
        async function renderAll(data) {
            // 计算统计卡片
            const totalGdp = data.reduce((sum, p) => sum + p.gdp, 0);
            const totalPopulation = data.reduce((sum, p) => sum + p.population, 0);
            const avgGdpPerCapita = (totalGdp / totalPopulation * 10000).toFixed(2);
            const avgPopulation = (totalPopulation / data.length).toFixed(0);

            document.getElementById('totalGdp').innerText = totalGdp.toLocaleString();
            document.getElementById('avgGdpPerCapita').innerText = avgGdpPerCapita;
            document.getElementById('avgPopulation').innerText = avgPopulation;
            document.getElementById('provinceCount').innerText = data.length;

            // 渲染表格
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = data.map(p => `
                <tr>
                    <td>${p.province}</td>
                    <td>${p.gdp.toLocaleString()}</td>
                    <td>${p.population.toLocaleString()}</td>
                    <td>${p.gdp_per_capita}</td>
                </tr>
            `).join('');

            // 渲染柱状图和饼图
            renderBarChart(data);
            renderPieChart(data);
            
            // 渲染折线图和散点图（需要多年度数据）
            const allYearsData = await loadAllYearsData();
            renderLineChart(allYearsData);
            renderScatterChart(data);
        }

        function renderBarChart(data) {
            const chart = echarts.init(document.getElementById('barChart'));
            chart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                xAxis: { type: 'category', data: data.map(p => p.province), axisLabel: { rotate: 45, fontSize: 10 } },
                yAxis: { type: 'value', name: 'GDP（亿元）' },
                series: [{
                    name: 'GDP', type: 'bar', data: data.map(p => p.gdp),
                    itemStyle: { color: '#667eea', label: { show: true, position: 'top', formatter: '{c}' } }
                }]
            });
            charts.bar = chart;
        }

        function renderPieChart(data) {
            const chart = echarts.init(document.getElementById('pieChart'));
            const top5 = [...data].sort((a, b) => b.gdp - a.gdp).slice(0, 5);
            const otherValue = data.slice(5).reduce((sum, p) => sum + p.gdp, 0);
            
            chart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {d}%' },
                series: [{
                    type: 'pie', radius: '55%',
                    data: [...top5.map(p => ({ name: p.province, value: p.gdp })), { name: '其他', value: otherValue }],
                    label: { show: true, formatter: '{b}: {d}%' }
                }]
            });
            charts.pie = chart;
        }

        async function renderLineChart(allYearsData) {
            const chart = echarts.init(document.getElementById('lineChart'));
            const years = [2021, 2022, 2023, 2024];
            const provinces = ['广东', '江苏', '浙江', '山东'];
            
            const series = provinces.map(prov => {
                const data = years.map(year => {
                    const yearData = allYearsData[year];
                    if (!yearData) return 0;
                    const provinceData = yearData.find(p => p.province === prov);
                    return provinceData ? provinceData.gdp : 0;
                });
                return { name: prov, type: 'line', data, smooth: true, symbol: 'circle', symbolSize: 8 };
            });

            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: provinces },
                xAxis: { type: 'category', data: years, name: '年份' },
                yAxis: { type: 'value', name: 'GDP（亿元）' },
                series: series
            });
            charts.line = chart;
        }

        function renderScatterChart(data) {
            const chart = echarts.init(document.getElementById('scatterChart'));
            chart.setOption({
                tooltip: { trigger: 'axis', formatter: (p) => `${p.value[0]}万人<br/>GDP: ${p.value[1]}亿元` },
                xAxis: { name: '人口（万人）', type: 'value' },
                yAxis: { name: 'GDP（亿元）', type: 'value' },
                series: [{
                    type: 'scatter', data: data.map(p => [p.population, p.gdp]),
                    symbolSize: 12, color: '#764ba2'
                }]
            });
            charts.scatter = chart;
        }

        function showLoading() {
            // 可选：显示加载动画
        }

        // 年份切换
        document.querySelectorAll('.year-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentYear = parseInt(btn.dataset.year);
                loadData();
            });
        });

        // 窗口自适应
        window.addEventListener('resize', () => {
            Object.values(charts).forEach(chart => chart?.resize());
        });

        // 启动
        checkAuth();
    </script>
</body>
</html>
