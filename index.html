<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>全国城市人口数据可视化分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #f5f7fc 0%, #eef2f7 100%);
            font-family: 'Segoe UI', 'Roboto', 'Microsoft YaHei', sans-serif;
            padding: 30px 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1f2d3d;
            font-weight: 600;
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            color: #5a6874;
            margin-bottom: 20px;
            padding-bottom: 15px;
        }
        .year-select {
            text-align: center;
            margin-bottom: 30px;
        }
        .year-btn {
            padding: 10px 16px;
            margin: 0 6px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .year-btn:hover {
            background: #2563eb;
        }
        .year-btn.active {
            background: #1d4ed8;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
            gap: 30px;
        }
        .card {
            background: rgba(255,255,255,0.92);
            border-radius: 24px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .chart-title {
            background: #ffffffcc;
            padding: 16px 24px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e466e;
            border-left: 5px solid #3b82f6;
            border-bottom: 1px solid #e4edf5;
        }
        .chart-box {
            width: 100%;
            height: 400px;
            padding: 12px;
        }
        footer {
            text-align: center;
            margin-top: 45px;
            color: #6c7a89;
            font-size: 0.85rem;
            border-top: 1px solid #cbdde9;
            padding-top: 25px;
        }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .chart-box { height: 320px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🏙️ 全国重点城市人口与经济可视化分析</h1>
    <div class="subtitle">数据来源：各市统计公报 | 可视化引擎：ECharts</div>

    <div class="year-select">
        <button class="year-btn" onclick="loadYear(2023)">2023年</button>
        <button class="year-btn" onclick="loadYear(2024)">2024年</button>
        <button class="year-btn" onclick="loadYear(2025)">2025年</button>
        <button class="year-btn active" onclick="loadYear(2026)">2026年</button>
    </div>

    <div class="grid">
        <div class="card">
            <div class="chart-title">📊 城市常住人口对比（柱状图）</div>
            <div id="bar-chart" class="chart-box"></div>
        </div>

        <div class="card">
            <div class="chart-title">📈 GDP与城镇化率关系（折线图-双轴）</div>
            <div id="line-chart" class="chart-box"></div>
        </div>

        <div class="card">
            <div class="chart-title">🥧 城区人口占比分布（环形图）</div>
            <div id="pie-chart" class="chart-box"></div>
        </div>

        <div class="card">
            <div class="chart-title">📊 人口结构堆叠图（常住+城区人口）</div>
            <div id="stacked-bar" class="chart-box"></div>
        </div>

        <div class="card">
            <div class="chart-title">🛸 核心城市综合能力雷达图</div>
            <div id="radar-chart" class="chart-box"></div>
        </div>
    </div>
    <footer>💡 提示：点击年份按钮切换不同年份数据 | 鼠标悬浮查看详情</footer>
</div>

<script>
let barChart, lineChart, pieChart, stackedChart, radarChart;
let currentYear = 2026;

// 初始化图表
function initCharts() {
  barChart = echarts.init(document.getElementById('bar-chart'));
  lineChart = echarts.init(document.getElementById('line-chart'));
  pieChart = echarts.init(document.getElementById('pie-chart'));
  stackedChart = echarts.init(document.getElementById('stacked-bar'));
  radarChart = echarts.init(document.getElementById('radar-chart'));
}

// 加载年份数据
async function loadYear(year) {
  currentYear = year;
  document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
  event?.target.classList.add('active');

  const res = await fetch(`/api/city-data?year=${year}`);
  const data = await res.json();
  renderAllCharts(data);
}

// 渲染所有图表
function renderAllCharts(cityData) {
  // 柱状图
  barChart.setOption({
    xAxis: { data: cityData.cities },
    series: [{ data: cityData.population }]
  });

  // 折线图
  lineChart.setOption({
    xAxis: { data: cityData.cities },
    series: [
      { data: cityData.gdp },
      { data: cityData.urbanization_rate }
    ]
  });

  // 饼图
  const pieData = cityData.cities.map((name, i) => ({ name, value: cityData.urban_population[i] }));
  pieData.sort((a,b)=>b.value-a.value);
  pieChart.setOption({ series: [{ data: pieData.slice(0,8) }] });

  // 堆叠图
  stackedChart.setOption({
    xAxis: { data: cityData.cities },
    series: [
      { data: cityData.urban_population },
      { data: cityData.population.map((v,i)=> v - cityData.urban_population[i]) }
    ]
  });

  // 雷达图
  const radarCities = ["上海","北京","深圳","广州","成都","杭州"];
  const maxPop = Math.max(...cityData.population);
  const maxGdp = Math.max(...cityData.gdp);
  const radarSeries = radarCities.map(city => {
    const idx = cityData.cities.indexOf(city);
    if(idx===-1) return {name:city,value:[0,0,0,0]};
    return {
      name:city,
      value:[
        cityData.population[idx]/maxPop,
        cityData.gdp[idx]/maxGdp,
        cityData.urbanization_rate[idx]/100,
        cityData.urban_population[idx]/cityData.population[idx]
      ]
    }
  });
  radarChart.setOption({ series: [{ data: radarSeries }] });
}

// 启动
initCharts();
loadYear(2026);

window.addEventListener('resize', () => {
  barChart.resize();
  lineChart.resize();
  pieChart.resize();
  stackedChart.resize();
  radarChart.resize();
});
</script>
</body>
</html>
