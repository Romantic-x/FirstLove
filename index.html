<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>全国城市人口数据可视化分析（API 动态加载）</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #f5f7fc 0%, #eef2f7 100%);
            font-family: 'Segoe UI', 'Roboto', 'Microsoft YaHei', sans-serif;
            padding: 30px 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #1f2d3d;
            font-weight: 600;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #5a6874;
            margin-bottom: 40px;
            border-bottom: 2px solid #cdd9ed;
            padding-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
            gap: 30px;
        }
        .card {
            background: rgba(255,255,255,0.92);
            border-radius: 24px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.12);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 25px 40px -14px rgba(0,0,0,0.2); }
        .chart-title {
            background: #ffffffcc;
            padding: 16px 24px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e466e;
            border-left: 5px solid #3b82f6;
            border-bottom: 1px solid #e4edf5;
        }
        .chart-box { width: 100%; height: 400px; padding: 12px; }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #3b82f6;
        }
        footer {
            text-align: center;
            margin-top: 45px;
            color: #6c7a89;
            font-size: 0.85rem;
            border-top: 1px solid #cbdde9;
            padding-top: 25px;
        }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .chart-box { height: 320px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🏙️ 全国重点城市人口与经济可视化分析</h1>
    <div class="subtitle">数据动态加载自 Cloudflare Workers API | 支持按城市查询</div>

    <div class="grid" id="charts-container">
        <div class="loading">⏳ 正在从 API 加载数据，请稍候...</div>
    </div>
    <footer>💡 提示：鼠标悬浮图表查看详细数值 | 数据来源：2023年各市统计公报 | 前后端分离架构</footer>
</div>

<script>
    // 请将下面的地址替换为你部署的 Worker 地址
    const API_BASE_URL = 'city-api.13986517961.workers.dev';

    let cityData = null;

    // 初始化所有图表的函数（等数据加载完成后调用）
    function renderAllCharts(data) {
        // 清除 loading 占位
        const container = document.getElementById('charts-container');
        container.innerHTML = `
            <div class="card"><div class="chart-title">📊 城市常住人口对比（柱状图）</div><div id="bar-chart" class="chart-box"></div></div>
            <div class="card"><div class="chart-title">📈 GDP与城镇化率关系（折线图-双轴）</div><div id="line-chart" class="chart-box"></div></div>
            <div class="card"><div class="chart-title">🥧 城区人口占比分布（环形图）</div><div id="pie-chart" class="chart-box"></div></div>
            <div class="card"><div class="chart-title">📊 人口结构堆叠图（常住+城区人口）</div><div id="stacked-bar" class="chart-box"></div></div>
            <div class="card"><div class="chart-title">🛸 核心城市综合能力雷达图（归一化指标）</div><div id="radar-chart" class="chart-box"></div></div>
        `;

        // 1. 柱状图
        const barChart = echarts.init(document.getElementById('bar-chart'));
        barChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: '{b}<br/>常住人口: {c} 万人' },
            xAxis: { type: 'category', data: data.cities, axisLabel: { rotate: 35 } },
            yAxis: { type: 'value', name: '人口 (万人)' },
            series: [{
                name: '常住人口', type: 'bar', data: data.population,
                itemStyle: { borderRadius: [6,6,0,0], color: '#3b82f6' },
                label: { show: true, position: 'top', formatter: '{c}万' }
            }]
        });

        // 2. 折线图（双轴）
        const lineChart = echarts.init(document.getElementById('line-chart'));
        lineChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: ['GDP (亿元)', '城镇化率 (%)'] },
            xAxis: { type: 'category', data: data.cities, axisLabel: { rotate: 35 } },
            yAxis: [{ type: 'value', name: 'GDP (亿元)' }, { type: 'value', name: '城镇化率 (%)', min: 60, max: 105 }],
            series: [
                { name: 'GDP (亿元)', type: 'line', data: data.gdp, smooth: true, lineStyle: { width: 3, color: '#f97316' }, symbol: 'circle', label: { show: true } },
                { name: '城镇化率 (%)', type: 'line', data: data.urbanization_rate, yAxisIndex: 1, smooth: true, lineStyle: { width: 3, color: '#10b981' }, symbol: 'diamond', label: { show: true, formatter: '{c}%' } }
            ]
        });

        // 3. 环形饼图（城区人口占比，前8+其他）
        let pieData = data.cities.map((city, idx) => ({ name: city, value: data.urban_population[idx] }));
        pieData.sort((a,b)=>b.value - a.value);
        const top8 = pieData.slice(0,8);
        const otherSum = pieData.slice(8).reduce((sum,item)=>sum+item.value,0);
        if(otherSum>0) top8.push({ name:'其他城市', value: otherSum });
        const pieChart = echarts.init(document.getElementById('pie-chart'));
        pieChart.setOption({
            tooltip: { trigger: 'item', formatter: '{b}: {c}万人 ({d}%)' },
            legend: { orient: 'vertical', left: 'left', type: 'scroll' },
            series: [{ type: 'pie', radius: ['45%', '70%'], data: top8, itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 2 } }]
        });

        // 4. 堆叠柱状图
        const stackedChart = echarts.init(document.getElementById('stacked-bar'));
        stackedChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: (params) => {
                let res = params[0].axisValue + '<br/>';
                let total = 0;
                params.forEach(p => { res += `${p.marker} ${p.seriesName}: ${p.value}万人<br/>`; total += p.value; });
                res += `📌 合计: ${total}万人`;
                return res;
            } },
            legend: { data: ['城区人口', '常住人口（其余）'] },
            xAxis: { type: 'category', data: data.cities, axisLabel: { rotate: 35 } },
            yAxis: { type: 'value', name: '人口 (万人)' },
            series: [
                { name: '城区人口', type: 'bar', stack: 'total', data: data.urban_population, color: '#f59e0b', label: { show: true, position: 'inside' } },
                { name: '常住人口（其余）', type: 'bar', stack: 'total', data: data.population.map((v,i)=> v - data.urban_population[i]), color: '#3b82f6', label: { show: true, position: 'inside', formatter: (p) => p.value > 50 ? `${p.value}万` : '' } }
            ]
        });

        // 5. 雷达图
        const radarCities = ["上海", "北京", "深圳", "广州", "成都", "杭州"];
        const maxPop = Math.max(...data.population);
        const maxGdp = Math.max(...data.gdp);
        function getRadarData(city) {
            let idx = data.cities.indexOf(city);
            if(idx===-1) return [0,0,0,0];
            let popNorm = data.population[idx] / maxPop;
            let gdpNorm = data.gdp[idx] / maxGdp;
            let urbanNorm = data.urbanization_rate[idx] / 100;
            let urbanPopNorm = data.urban_population[idx] / data.population[idx];
            return [popNorm, gdpNorm, urbanNorm, urbanPopNorm];
        }
        const radarSeries = radarCities.map(city => ({
            name: city, value: getRadarData(city), areaStyle: { opacity: 0.2 }
        }));
        const radarChart = echarts.init(document.getElementById('radar-chart'));
        radarChart.setOption({
            legend: { data: radarCities, orient: 'vertical', left: 'left' },
            radar: {
                indicator: [
                    { name: '人口规模', max: 1 }, { name: '经济总量(GDP)', max: 1 },
                    { name: '城镇化水平', max: 1 }, { name: '城区集聚度', max: 1 }
                ],
                shape: 'circle'
            },
            series: [{ type: 'radar', data: radarSeries, areaStyle: { opacity: 0.15 } }]
        });

        // 窗口自适应
        window.addEventListener('resize', () => {
            [barChart, lineChart, pieChart, stackedChart, radarChart].forEach(chart => chart.resize());
        });
    }

    // 从 API 加载数据
    fetch(API_BASE_URL)
        .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        })
        .then(data => {
            cityData = data;
            renderAllCharts(cityData);
        })
        .catch(error => {
            console.error('API 请求失败:', error);
            document.getElementById('charts-container').innerHTML = `<div class="loading" style="color:red;">❌ 数据加载失败，请检查 API 地址是否正确或网络是否通畅。<br>错误详情：${error.message}</div>`;
        });
</script>
</body>
</html>
