<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>全国城市人口数据可视化分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: linear-gradient(145deg, #f5f7fc 0%, #eef2f7 100%); font-family: 'Segoe UI', sans-serif; padding:30px 20px; }
        .container { max-width:1400px; margin:0 auto; }
        h1 { text-align:center; color:#1f2d3d; font-size:2.2rem; margin-bottom:8px; }
        .subtitle { text-align:center; color:#5a6874; margin-bottom:20px; }
        .toolbar { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-bottom:24px; }
        .year-btn { padding:10px 16px; border:none; border-radius:10px; background:#3b82f6; color:white; cursor:pointer; }
        .year-btn.active { background:#1d4ed8; }
        .search-box, .province-box { padding:10px 14px; border:1px solid #ddd; border-radius:10px; width:180px; }
        .admin-btn { padding:10px 14px; background:#ef4444; color:white; border:none; border-radius:10px; cursor:pointer; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(550px,1fr)); gap:30px; }
        .card { background:white; border-radius:24px; box-shadow:0 20px 35px -12px rgba(0,0,0,0.12); overflow:hidden; }
        .chart-title { padding:16px 24px; font-size:1.25rem; font-weight:600; color:#1e466e; border-left:5px solid #3b82f6; background:#f9fbfd; }
        .chart-box { width:100%; height:400px; padding:12px; }
        footer { text-align:center; margin-top:45px; color:#6c7a89; }
        .modal { display:none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏙️ 全国重点城市人口与经济可视化分析</h1>
    <div class="subtitle">数据来源：各市统计公报 | 可视化引擎：ECharts</div>

    <div class="toolbar">
        <button class="year-btn" onclick="load(2023, event)">2023</button>
        <button class="year-btn" onclick="load(2024, event)">2024</button>
        <button class="year-btn" onclick="load(2025, event)">2025</button>
        <button class="year-btn active" onclick="load(2026, event)">2026</button>

        <input type="text" class="search-box" placeholder="🔍 搜索城市" id="search">
        <select class="province-box" id="province">
            <option value="">全部省份</option>
        </select>
    </div>

    <div class="grid">
        <div class="card"><div class="chart-title">📊 城市常住人口对比</div><div id="bar" class="chart-box"></div></div>
        <div class="card"><div class="chart-title">📈 GDP与城镇化率</div><div id="line" class="chart-box"></div></div>
        <div class="card"><div class="chart-title">🥧 城区人口占比</div><div id="pie" class="chart-box"></div></div>
        <div class="card"><div class="chart-title">📊 人口结构堆叠</div><div id="stack" class="chart-box"></div></div>
        <div class="card"><div class="chart-title">🛸 综合能力雷达</div><div id="radar" class="chart-box"></div></div>
    </div>
</div>

<script>
let bar, line, pie, stack, radar;
let yearNow = 2026;

init();
loadProvinces();
load(2026);

function init() {
    bar = echarts.init(document.getElementById('bar'));
    line = echarts.init(document.getElementById('line'));
    pie = echarts.init(document.getElementById('pie'));
    stack = echarts.init(document.getElementById('stack'));
    radar = echarts.init(document.getElementById('radar'));
}

async function load(year, event) {
    yearNow = year;
    document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
    if (event) event.target.classList.add('active');

    const search = document.getElementById('search').value;
    const province = document.getElementById('province').value;

    try {
        const res = await fetch(`/api/city-data?year=${year}&search=${search}&province=${province}`);
        const d = await res.json();

        if (!d || !d.cities || d.cities.length === 0) {
            [bar, line, pie, stack, radar].forEach(c => c.clear());
            return;
        }

        bar.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { data: d.cities },
            series: [{ type: 'bar', data: d.population }]
        });

        line.setOption({
            tooltip: { trigger: 'axis' },
            xAxis: { data: d.cities },
            series: [
                { name: 'GDP', data: d.gdp },
                { name: '城镇化率', data: d.urbanization_rate }
            ]
        });

        pie.setOption({
            series: [{
                type: 'pie',
                radius: ['40%', '70%'],
                data: d.cities.map((n, i) => ({ name: n, value: d.urban_population[i] }))
            }]
        });

        stack.setOption({
            xAxis: { data: d.cities },
            series: [
                { name: '城区人口', stack: 'all', data: d.urban_population },
                { name: '其他', stack: 'all', data: d.population.map((v, i) => v - d.urban_population[i]) }
            ]
        });

        radar.setOption({
            radar: {
                indicator: [
                    { name: '人口', max: 3500 },
                    { name: '城区', max: 2500 },
                    { name: 'GDP', max: 50000 },
                    { name: '城镇化', max: 100 }
                ]
            },
            series: [{
                type: 'radar',
                data: d.cities.map((n, i) => ({
                    name: n,
                    value: [d.population[i], d.urban_population[i], d.gdp[i], d.urbanization_rate[i]]
                }))
            }]
        });

    } catch (err) {
        console.error(err);
        [bar, line, pie, stack, radar].forEach(c => c.clear());
    }
}

async function loadProvinces() {
    try {
        const res = await fetch('/api/provinces');
        const list = await res.json();
        const sel = document.getElementById('province');
        list.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p;
            opt.innerText = p;
            sel.appendChild(opt);
        });
    } catch (e) {}
}

document.getElementById('search').oninput = () => load(yearNow);
document.getElementById('province').onchange = () => load(yearNow);

window.addEventListener('resize', () => {
    bar.resize();
    line.resize();
    pie.resize();
    stack.resize();
    radar.resize();
});
</script>
</body>
</html>
